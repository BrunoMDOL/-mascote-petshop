<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>
    <nav th:replace="~{fragments/header :: categorias}"></nav>

    <main class="py-4">
        <div class="container">
            <!-- Se filtro por categoria ativo -->
            <div th:if="${categoriaAtiva != null}">
                <div class="row g-4" id="produtos-grid">
                    <div th:each="produto : ${produtos}" class="col-6 col-md-4 col-lg-3">
                        <div class="card produto-card h-100">
                            <div class="produto-img-container">
                                <img th:if="${produto.imagemUrl != null and !produto.imagemUrl.isEmpty()}"
                                     th:src="${produto.imagemUrl}"
                                     th:alt="${produto.nome}"
                                     class="card-img-top produto-img">
                                <div th:unless="${produto.imagemUrl != null and !produto.imagemUrl.isEmpty()}"
                                     class="produto-img-placeholder">
                                    <i class="bi bi-image"></i>
                                </div>
                            </div>
                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title" th:text="${produto.nome}">Produto</h6>
                                <p class="card-text small text-muted flex-grow-1" th:text="${produto.descricao}">Descrição</p>
                                <div class="mt-auto">
                                    <p class="h5 text-primary mb-2" th:text="${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">0,00</p>
                                    <button class="btn-adicionar"
                                            th:data-id="${produto.id}"
                                            th:data-nome="${produto.nome}"
                                            th:data-preco="${produto.preco}"
                                            th:data-imagem="${produto.imagemUrl}"
                                            onclick="adicionarAoCarrinho(this)">
                                        <i class="bi bi-bag-plus"></i>
                                        <span>Adicionar</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(produtos)}" class="text-center py-5">
                    <i class="bi bi-inbox display-1 text-muted"></i>
                    <p class="text-muted mt-3">Nenhum produto encontrado nesta categoria</p>
                </div>
            </div>

            <!-- Se mostrando todos (agrupado por categoria) -->
            <div th:if="${categoriaAtiva == null}">
                <div th:each="entry : ${produtosPorCategoria}">
                    <h3 class="mb-3 mt-4 categoria-titulo" th:text="${entry.key.nome}">Categoria</h3>
                    <div class="row g-4 mb-4">
                        <div th:each="produto : ${entry.value}" class="col-6 col-md-4 col-lg-3">
                            <div class="card produto-card h-100">
                                <div class="produto-img-container">
                                    <img th:if="${produto.imagemUrl != null and !produto.imagemUrl.isEmpty()}"
                                         th:src="${produto.imagemUrl}"
                                         th:alt="${produto.nome}"
                                         class="card-img-top produto-img">
                                    <div th:unless="${produto.imagemUrl != null and !produto.imagemUrl.isEmpty()}"
                                         class="produto-img-placeholder">
                                        <i class="bi bi-image"></i>
                                    </div>
                                </div>
                                <div class="card-body d-flex flex-column">
                                    <h6 class="card-title" th:text="${produto.nome}">Produto</h6>
                                    <p class="card-text small text-muted flex-grow-1" th:text="${produto.descricao}">Descrição</p>
                                    <div class="mt-auto">
                                        <p class="h5 text-primary mb-2">
                                            R$ <span th:text="${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">0,00</span>
                                        </p>
                                        <button class="btn-adicionar"
                                                th:data-id="${produto.id}"
                                                th:data-nome="${produto.nome}"
                                                th:data-preco="${produto.preco}"
                                                th:data-imagem="${produto.imagemUrl}"
                                                onclick="adicionarAoCarrinho(this)">
                                            <i class="bi bi-bag-plus"></i>
                                            <span>Adicionar</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${#maps.isEmpty(produtosPorCategoria)}" class="text-center py-5">
                    <i class="bi bi-inbox display-1 text-muted"></i>
                    <p class="text-muted mt-3">Nenhum produto disponível no momento</p>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/footer :: carrinho}"></div>
</body>
</html>
