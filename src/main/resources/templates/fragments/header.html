<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${petshopNome}">Mascote Pet Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<header th:fragment="header" class="header-main">
    <!-- Barra superior com contatos -->
    <div class="header-top text-white">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start">
                    <span class="me-4">
                        <i class="bi bi-telephone me-1"></i>
                        <span th:text="${petshopTelefone}"></span>
                    </span>
                    <span>
                        <i class="bi bi-whatsapp me-1"></i>
                        <span th:text="'(' + ${#strings.substring(petshopWhatsapp, 2, 4)} + ') ' + ${#strings.substring(petshopWhatsapp, 4, 9)} + '-' + ${#strings.substring(petshopWhatsapp, 9)}"></span>
                    </span>
                </div>
                <div class="col-md-6 text-center text-md-end mt-2 mt-md-0">
                    <span>
                        <i class="bi bi-envelope me-1"></i>
                        <span th:text="${petshopEmail}"></span>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- Header principal com logo e carrinho -->
    <div class="header-main-content">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-8 col-md-6">
                    <a href="/" class="text-decoration-none d-flex align-items-center gap-3">
                        <img src="/images/logo.png" alt="Mascote Pet Shop" class="logo" onerror="this.style.display='none'">
                        <div>
                            <h1 class="brand-name" th:text="${petshopNome}">Mascote Pet Shop</h1>
                        </div>
                    </a>
                </div>
                <div class="col-4 col-md-6 text-end">
                    <button class="btn btn-primary position-relative" id="btn-carrinho" onclick="toggleCarrinho()">
                        <i class="bi bi-bag"></i>
                        <span class="d-none d-md-inline ms-1">Carrinho</span>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill" id="carrinho-count">
                            0
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Navegacao de categorias -->
<nav th:fragment="categorias" class="nav-categorias">
    <div class="container">
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a href="/" class="btn"
               th:classappend="${categoriaAtiva == null} ? 'active' : ''">
                Todos os Produtos
            </a>
            <a th:each="cat : ${categorias}"
               th:href="@{/categoria/{id}(id=${cat.id})}"
               th:text="${cat.nome}"
               th:classappend="${categoriaAtiva != null && categoriaAtiva == cat.id} ? 'active' : ''"
               class="btn">
            </a>
        </div>
    </div>
</nav>
</html>
