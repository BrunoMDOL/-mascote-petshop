<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin">
                <i class="bi bi-gear"></i> Admin - Mascote Pet Shop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin"><i class="bi bi-speedometer2"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/produtos"><i class="bi bi-box"></i> Produtos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/categorias"><i class="bi bi-tags"></i> Categorias</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-eye"></i> Ver Site</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/logout"><i class="bi bi-box-arrow-right"></i> Sair</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-box"></i> Produtos</h2>
            <a href="/admin/produtos/novo" class="btn btn-primary">
                <i class="bi bi-plus"></i> Novo Produto
            </a>
        </div>

        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Imagem</th>
                                <th>Nome</th>
                                <th>Categoria</th>
                                <th>Preço</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="produto : ${produtos}">
                                <td>
                                    <img th:if="${produto.imagemUrl != null}"
                                         th:src="${produto.imagemUrl}"
                                         alt="Imagem" class="img-thumbnail" style="width: 60px; height: 60px; object-fit: cover;">
                                    <span th:unless="${produto.imagemUrl != null}" class="text-muted">
                                        <i class="bi bi-image display-6"></i>
                                    </span>
                                </td>
                                <td>
                                    <strong th:text="${produto.nome}">Produto</strong>
                                    <br>
                                    <small class="text-muted" th:text="${#strings.abbreviate(produto.descricao, 50)}">Descrição</small>
                                </td>
                                <td th:text="${produto.categoria.nome}">Categoria</td>
                                <td th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                                <td>
                                    <span th:if="${produto.ativo}" class="badge bg-success">Ativo</span>
                                    <span th:unless="${produto.ativo}" class="badge bg-secondary">Inativo</span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/admin/produtos/editar/{id}(id=${produto.id})}"
                                           class="btn btn-outline-primary btn-sm" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/admin/produtos/alternar-status/{id}(id=${produto.id})}"
                                              method="post" style="display: inline;">
                                            <button type="submit" class="btn btn-outline-warning btn-sm"
                                                    th:title="${produto.ativo} ? 'Desativar' : 'Ativar'">
                                                <i th:class="${produto.ativo} ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                                            </button>
                                        </form>
                                        <form th:action="@{/admin/produtos/excluir/{id}(id=${produto.id})}"
                                              method="post" style="display: inline;"
                                              onsubmit="return confirm('Tem certeza que deseja excluir este produto?');">
                                            <button type="submit" class="btn btn-outline-danger btn-sm" title="Excluir">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${#lists.isEmpty(produtos)}" class="text-center py-4">
                    <i class="bi bi-inbox display-1 text-muted"></i>
                    <p class="text-muted mt-3">Nenhum produto cadastrado</p>
                    <a href="/admin/produtos/novo" class="btn btn-primary">
                        <i class="bi bi-plus"></i> Adicionar Produto
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
