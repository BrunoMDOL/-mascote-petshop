<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<footer th:fragment="footer" class="footer mt-5">
    <div class="container">
        <div class="row">
            <div class="col-md-4 mb-4 mb-md-0">
                <h5><i class="bi bi-geo-alt me-2"></i>Endereco</h5>
                <p th:text="${petshopEndereco}" class="mb-0"></p>
            </div>
            <div class="col-md-4 mb-4 mb-md-0">
                <h5><i class="bi bi-clock me-2"></i>Horario de Funcionamento</h5>
                <p class="mb-1" th:text="${horarioSemana}"></p>
                <p class="mb-1" th:text="${horarioSabado}"></p>
                <p class="mb-0" th:text="${horarioDomingo}"></p>
            </div>
            <div class="col-md-4">
                <h5><i class="bi bi-chat-dots me-2"></i>Contato</h5>
                <p class="mb-2">
                    <i class="bi bi-telephone me-2"></i>
                    <span th:text="${petshopTelefone}"></span>
                </p>
                <p class="mb-2">
                    <a th:href="@{https://wa.me/{numero}(numero=${petshopWhatsapp})}"
                       class="text-decoration-none" target="_blank">
                        <i class="bi bi-whatsapp me-2"></i>
                        WhatsApp
                    </a>
                </p>
                <p class="mb-0">
                    <a th:href="@{mailto:{email}(email=${petshopEmail})}"
                       class="text-decoration-none">
                        <i class="bi bi-envelope me-2"></i>
                        <span th:text="${petshopEmail}"></span>
                    </a>
                </p>
            </div>
        </div>
        <div class="footer-divider"></div>
        <div class="text-center footer-bottom">
            <span th:text="'© ' + ${#dates.year(#dates.createNow())} + ' ' + ${petshopNome} + ' - Todos os direitos reservados'"></span>
        </div>
    </div>
</footer>

<!-- Carrinho Sidebar + Scripts -->
<th:block th:fragment="carrinho">
    <div id="carrinho-sidebar" class="carrinho-sidebar">
        <div class="carrinho-header">
            <h5><i class="bi bi-bag me-2"></i>Meu Carrinho</h5>
            <button type="button" class="btn-close-carrinho" onclick="toggleCarrinho()">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        <div class="carrinho-body" id="carrinho-itens">
            <div class="carrinho-vazio">
                <i class="bi bi-bag-x d-block"></i>
                <p>Seu carrinho esta vazio</p>
            </div>
        </div>
        <div class="carrinho-footer">
            <div class="mb-3">
                <label for="cliente-nome" class="form-label fw-medium">Seu Nome</label>
                <input type="text" class="form-control" id="cliente-nome" placeholder="Digite seu nome" style="border-radius: 12px; border-color: #e8e4dd;">
            </div>
            <div class="mb-3">
                <label for="pedido-obs" class="form-label fw-medium">Observacoes</label>
                <textarea class="form-control" id="pedido-obs" rows="2" placeholder="Ex: entregar apos 18h" style="border-radius: 12px; border-color: #e8e4dd;"></textarea>
            </div>
            <div class="carrinho-total mb-3">
                <span class="carrinho-total-label">Total</span>
                <span id="carrinho-total" class="carrinho-total-valor">R$ 0,00</span>
            </div>
            <button class="btn-whatsapp" onclick="finalizarPedido()" id="btn-finalizar">
                <i class="bi bi-whatsapp"></i>
                Finalizar Pedido via WhatsApp
            </button>
        </div>
    </div>
    <div id="carrinho-overlay" class="carrinho-overlay" onclick="toggleCarrinho()"></div>

    <!-- Toast de notificacao -->
    <div class="toast-container">
        <div id="toast-notification" class="toast-notification">
            <i class="bi bi-check-circle"></i>
            <span id="toast-message">Produto adicionado!</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        const WHATSAPP_NUMBER = [[${petshopWhatsapp}]];
        const PETSHOP_NOME = [[${petshopNome}]];
    </script>
    <script th:src="@{/js/carrinho.js}"></script>
</th:block>
</html>
