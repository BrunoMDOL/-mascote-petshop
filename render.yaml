databases:
  - name: mascote-petshop-db
    databaseName: mascotepetshop
    user: mascote

services:
  - type: web
    name: mascote-petshop
    runtime: docker
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: mascote-petshop-db
          property: jdbcDatabaseUrl
