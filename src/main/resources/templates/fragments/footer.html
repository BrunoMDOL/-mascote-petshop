<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<footer th:fragment="footer" class="footer bg-primary text-white py-4 mt-5">
    <div class="container">
        <div class="row">
            <div class="col-md-4 mb-3 mb-md-0">
                <h5><i class="bi bi-geo-alt-fill"></i> Endereço</h5>
                <p th:text="${petshopEndereco}" class="mb-0"></p>
            </div>
            <div class="col-md-4 mb-3 mb-md-0">
                <h5><i class="bi bi-clock-fill"></i> Horário de Funcionamento</h5>
                <p class="mb-0" th:text="${horarioSemana}"></p>
                <p class="mb-0" th:text="${horarioSabado}"></p>
                <p class="mb-0" th:text="${horarioDomingo}"></p>
            </div>
            <div class="col-md-4">
                <h5><i class="bi bi-telephone-fill"></i> Contato</h5>
                <p class="mb-0">
                    <i class="bi bi-telephone"></i>
                    <span th:text="${petshopTelefone}"></span>
                </p>
                <p class="mb-0">
                    <a th:href="@{https://wa.me/{numero}(numero=${petshopWhatsapp})}"
                       class="text-white text-decoration-none" target="_blank">
                        <i class="bi bi-whatsapp"></i>
                        WhatsApp
                    </a>
                </p>
                <p class="mb-0">
                    <a th:href="@{mailto:{email}(email=${petshopEmail})}"
                       class="text-white text-decoration-none">
                        <i class="bi bi-envelope"></i>
                        <span th:text="${petshopEmail}"></span>
                    </a>
                </p>
            </div>
        </div>
        <hr class="my-3">
        <div class="text-center">
            <small th:text="'© ' + ${#dates.year(#dates.createNow())} + ' ' + ${petshopNome} + ' - Todos os direitos reservados'"></small>
        </div>
    </div>
</footer>

<!-- Carrinho Sidebar + Scripts -->
<th:block th:fragment="carrinho">
    <div id="carrinho-sidebar" class="carrinho-sidebar">
        <div class="carrinho-header">
            <h5><i class="bi bi-cart3"></i> Meu Carrinho</h5>
            <button type="button" class="btn-close btn-close-white" onclick="toggleCarrinho()"></button>
        </div>
        <div class="carrinho-body" id="carrinho-itens">
            <p class="text-center text-muted">Seu carrinho está vazio</p>
        </div>
        <div class="carrinho-footer">
            <div class="mb-3">
                <label for="cliente-nome" class="form-label">Seu Nome:</label>
                <input type="text" class="form-control" id="cliente-nome" placeholder="Digite seu nome">
            </div>
            <div class="mb-3">
                <label for="pedido-obs" class="form-label">Observações:</label>
                <textarea class="form-control" id="pedido-obs" rows="2" placeholder="Ex: entregar após 18h"></textarea>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <strong>Total:</strong>
                <strong id="carrinho-total" class="text-primary fs-4">R$ 0,00</strong>
            </div>
            <button class="btn btn-success w-100" onclick="finalizarPedido()" id="btn-finalizar">
                <i class="bi bi-whatsapp"></i> Finalizar Pedido via WhatsApp
            </button>
        </div>
    </div>
    <div id="carrinho-overlay" class="carrinho-overlay" onclick="toggleCarrinho()"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        const WHATSAPP_NUMBER = [[${petshopWhatsapp}]];
        const PETSHOP_NOME = [[${petshopNome}]];
    </script>
    <script th:src="@{/js/carrinho.js}"></script>
</th:block>
</html>
